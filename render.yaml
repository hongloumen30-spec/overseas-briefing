services:
  - type: web
    name: tokenhub-claude-opus-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r tokenhub_mcp/requirements.txt
    startCommand: uvicorn tokenhub_mcp.asgi:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: TOKENHUB_API_KEY
        sync: false
      - key: MCP_ACCESS_TOKEN
        sync: false
