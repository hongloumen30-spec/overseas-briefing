name: TokenHub MCP App Offline Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-mcp-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install "mcp>=2,<3" requests
      - name: Verify MCP registration and verbatim rendering
        run: python -m unittest discover -s tokenhub_mcp/tests -v
