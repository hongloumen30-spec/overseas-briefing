name: TokenHub Client Tests

on:
  pull_request:
  push:
    branches:
      - main
      - feat/tokenhub-claude-opus-4-7-stable

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing HTTP dependency
        run: python -m pip install requests
      - name: Run offline TokenHub tests
        run: python -m unittest -v test_tokenhub_chat.py
